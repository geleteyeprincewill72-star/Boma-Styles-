<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Sphere Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow-grad)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Central Interconnected Sphere Core -->
  <g filter="url(#glow)">
    <!-- Outer Rings / Orbit tracks -->
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="url(#primary-grad)" stroke-width="8" transform="rotate(-30 256 256)" opacity="0.85"/>
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="url(#primary-grad)" stroke-width="8" transform="rotate(30 256 256)" opacity="0.85"/>
    <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-dasharray="10, 15" opacity="0.5"/>
    
    <!-- Central sphere boundary -->
    <circle cx="256" cy="256" r="90" fill="#090d16" stroke="url(#primary-grad)" stroke-width="10"/>
    
    <!-- Inner Sphere Details / Network Nodes -->
    <line x1="256" y1="166" x2="256" y2="346" stroke="url(#primary-grad)" stroke-width="3" opacity="0.5" />
    <line x1="166" y1="256" x2="346" y2="256" stroke="url(#primary-grad)" stroke-width="3" opacity="0.5" />
    
    <!-- Nodes -->
    <circle cx="256" cy="166" r="10" fill="#22d3ee" />
    <circle cx="256" cy="346" r="10" fill="#ec4899" />
    <circle cx="166" cy="256" r="10" fill="#8b5cf6" />
    <circle cx="346" cy="256" r="10" fill="#22d3ee" />
    <circle cx="256" cy="256" r="18" fill="url(#primary-grad)" />
    
    <!-- Dynamic orbital particle -->
    <circle cx="170" cy="206" r="6" fill="#ffffff" filter="url(#glow)" />
    <circle cx="342" cy="306" r="6" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
